<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data Based — collaborative architecture boards for engineers</title>
  <meta name="description" content="Collaborative architecture boards for engineers. Place schema, API, and effect cards and edit them in the vendor’s own language.">
  <meta name="theme-color" content="#e6e6e3">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Absolute og:url / og:image: set PUBLIC_ORIGIN at Vercel build (see README). Unset keeps path-relative URLs — no invented domain. Crawlers that require an absolute URL need the full origin. -->
  <meta property="og:title" content="Data Based — collaborative architecture boards for engineers">
  <meta property="og:description" content="Collaborative architecture boards for engineers. Place schema, API, and effect cards and edit them in the vendor’s own language.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/splash">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="DATA BASED">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Data Based — collaborative architecture boards for engineers">
  <meta name="twitter:description" content="Collaborative architecture boards for engineers. Place schema, API, and effect cards and edit them in the vendor’s own language.">
  <meta name="twitter:image" content="/og.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/splash.css">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="/js/clerk-boot.js"></script>
</head>
<body class="is-gated is-splash">
  <!--
    THESIS: Logged-out visitors meet the paper board itself — cream field, hairline frame, schema cards — not a Sign in wall and not a purple SaaS blob.
    OWN-WORLD: Cool gray #e6e6e3 dots on white page, ink #111, IBM Plex Condensed wordmark, 1px #d2d2cc rules, white card islands.
    STORY: Request access joins a waitlist that does not guarantee a seat. People who already have one Sign in with Google and land on /.
    FIRST VIEWPORT: Wordmark left (uncropped), Sign in with Google right. “Collaborative architecture boards.” stacked Request access. Framed shared-board preview.
    FORM: Pinned FigJam / Figma paper studio. Seed skipped — the brief named the world.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <section class="screen gate-screen splash" id="screen-splash" role="main" aria-labelledby="splash-title">
    <header class="splash-bar">
      <a class="wordmark splash-wordmark" href="/splash" aria-label="Data Based">
        <svg class="wordmark-mark" viewBox="-1 -1 16 16" aria-hidden="true">
          <rect class="grid" x="0.5" y="0.5" width="13" height="13"/>
          <path class="grid" d="M7 0.5v13M0.5 7h13"/>
          <rect class="cell is-on" x="1" y="7.5" width="12" height="5.5"/>
          <rect class="cell is-next" x="1" y="1" width="12" height="5.5"/>
        </svg>
        <span class="wordmark-type">
          <span class="wordmark-data">DATA</span>
          <span class="wordmark-based">BASED</span>
        </span>
      </a>
      <button type="button" class="splash-google" id="google-signin">
        <svg class="splash-google-mark" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.17.282-1.709V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.335z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        <span class="splash-google-label" id="google-signin-label">Sign in with Google</span>
      </button>
    </header>

    <div class="splash-shell">
      <div class="splash-copy">
        <h1 id="splash-title">Collaborative architecture boards.</h1>
        <p class="splash-lead">Invite-only early access. One shared canvas for schema, API, and effect cards — edited in Prisma, Drizzle, GraphQL, or SQL, not a sticky note pretending to be a table.</p>
        <form class="splash-form" id="waitlist-form">
          <label class="sr-only" for="waitlist-email">Work email</label>
          <input type="email" id="waitlist-email" name="email" placeholder="Work email" required autocomplete="email" inputmode="email" aria-describedby="who-err waitlist-ok">
          <button type="submit" class="btn" id="waitlist-submit">Request access</button>
        </form>
        <p class="splash-ok" id="waitlist-ok" hidden role="status"></p>
        <p class="parse-err" id="who-err" hidden role="alert"></p>
        <p class="splash-note">A request doesn’t guarantee a spot. Already have one? Sign in with Google.</p>
      </div>

      <figure class="splash-stage" aria-hidden="true">
        <div class="splash-canvas">
          <div class="splash-world">
            <svg class="splash-wires" viewBox="0 0 640 400" aria-hidden="true">
              <path pathLength="1" d="M244 118 C 310 118, 310 208, 368 208"/>
              <path pathLength="1" d="M244 232 C 300 232, 300 208, 368 208"/>
            </svg>
            <div class="splash-boardchip">billing</div>
            <article class="card splash-card splash-card-user">
              <div class="card-bar"><span class="card-kind">Prisma</span><span class="card-title">User</span></div>
              <div class="card-body">
                <ul>
                  <li><code>id</code> String</li>
                  <li><code>email</code> String</li>
                  <li><code>orgId</code> String</li>
                </ul>
              </div>
            </article>
            <article class="card splash-card splash-card-org">
              <div class="card-bar"><span class="card-kind">SQL</span><span class="card-title">Org</span></div>
              <div class="card-body">
                <ul>
                  <li><code>id</code> uuid</li>
                  <li><code>name</code> text</li>
                </ul>
              </div>
            </article>
            <article class="card splash-card splash-card-gql is-sel">
              <div class="card-bar"><span class="card-kind">GraphQL</span><span class="card-title">schema</span></div>
              <div class="card-body">
                <code>type User { id: ID! }</code>
              </div>
            </article>
          </div>
        </div>
        <figcaption>Studio preview — synthetic cards, not a live board.</figcaption>
      </figure>
    </div>
  </section>

  <script src="/js/access.js"></script>
</body>
</html>
