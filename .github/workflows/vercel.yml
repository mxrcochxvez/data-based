# Official Vercel GitHub Actions pattern:
# https://vercel.com/guides/how-can-i-use-github-actions-with-vercel
#
# Repo secrets (do not commit values):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — .vercel/project.json "orgId" after `npx vercel link`
#   VERCEL_PROJECT_ID  — .vercel/project.json "projectId"
name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID."
            echo "Create a token at https://vercel.com/account/tokens"
            echo "Then: npx vercel login && npx vercel link --yes"
            echo "Copy orgId and projectId from .vercel/project.json into GitHub Actions secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy production
        run: vercel deploy --prebuilt --prod
